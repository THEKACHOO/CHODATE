<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convert</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="header-footer.css">

<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#15171c;--sub:#6b7280;--line:#e5e7eb;--accent:#2f6bff;--accent-ink:#fff;--ok:#15803d;--err:#dc2626;}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--ink:#f2f3f5;--sub:#9aa0ab;--line:#2a2e37;}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--ink:#f2f3f5;--sub:#9aa0ab;--line:#2a2e37;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  padding-top:calc(60px + env(safe-area-inset-top,0));
  padding-bottom:env(safe-area-inset-bottom,0);
}
.wrap{max-width:720px;margin:0 auto;padding:48px 20px 60px;}
h1{font-size:30px;font-weight:800;text-align:center;letter-spacing:-.5px;margin:0 0 6px;}
.sub{text-align:center;color:var(--sub);font-size:14px;margin-bottom:32px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px;}
@media(max-width:480px){.grid{grid-template-columns:1fr;}}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;text-align:left;font-family:inherit;}
.opt b{display:block;font-size:14px;margin-bottom:2px;}
.opt span{font-size:12px;color:var(--sub);}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, var(--card));}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px;display:none;}
.card.show{display:block;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.fmt{display:flex;gap:8px;margin-bottom:14px;}
.fmt button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;}
.fmt button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.drop{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--sub);font-size:13px;cursor:pointer;}
.drop.has{border-color:var(--accent);color:var(--ink);}
input[type=file]{display:none;}
.go{width:100%;margin-top:16px;background:var(--accent);color:var(--accent-ink);border:none;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;}
.go:disabled{opacity:.5;cursor:default;}
.note{font-size:11.5px;color:var(--sub);margin-top:10px;}
.result{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
.dl{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;}
.dl a{color:var(--accent);font-weight:600;text-decoration:none;}
.status{font-size:13px;margin-top:12px;}
.status.err{color:var(--err);}
.status.ok{color:var(--ok);}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin-right:6px;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
<h1>What do you need?</h1>
<div class="sub">Choose a conversion type, then upload your file</div>

<div class="grid" id="grid"></div>

<div class="card" id="card">
  <div id="fmtBox" class="fmt" style="display:none">
    <button data-f="jpeg" class="on">JPG</button>
    <button data-f="png">PNG</button>
  </div>
  <div class="drop" id="drop">Click to choose a file, or drag & drop here</div>
  <input type="file" id="fileInput">
  <button class="go" id="goBtn" disabled>Convert</button>
  <div class="note" id="note"></div>
  <div class="status" id="status"></div>
  <div class="result" id="result"></div>
</div>
</div>

<script>
const MAXMB = 20;
const OPTS = [
  {id:'pdf2img', t:'PDF to JPG/PNG', d:'Turn PDF pages into images', accept:'.pdf', multi:false, fmt:true},
  {id:'img2pdf', t:'JPG/PNG to PDF', d:'Combine images into one PDF', accept:'image/*', multi:true},
  {id:'jpg2png', t:'JPG to PNG', d:'Convert image format', accept:'.jpg,.jpeg', multi:false},
  {id:'png2jpg', t:'PNG to JPG', d:'Convert image format', accept:'.png', multi:false},
  {id:'pdf2word', t:'PDF to Word', d:'Extract PDF text to docx', accept:'.pdf', multi:false},
  {id:'word2pdf', t:'Word to PDF', d:'Turn docx into a PDF', accept:'.doc,.docx', multi:false},
];
let mode=null, files=[], imgFmt='jpeg';
const grid=document.getElementById('grid'), card=document.getElementById('card'), drop=document.getElementById('drop'),
      fileInput=document.getElementById('fileInput'), goBtn=document.getElementById('goBtn'),
      statusEl=document.getElementById('status'), resultEl=document.getElementById('result'),
      fmtBox=document.getElementById('fmtBox'), note=document.getElementById('note');

OPTS.forEach(o=>{
  const b=document.createElement('button');
  b.className='opt'; b.innerHTML=`<b>${o.t}</b><span>${o.d}</span>`;
  b.onclick=()=>selectMode(o.id);
  b.id='opt-'+o.id;
  grid.appendChild(b);
});

function selectMode(id){
  mode=id; files=[]; resultEl.innerHTML=''; statusEl.textContent=''; drop.classList.remove('has');
  drop.textContent='Click to choose a file, or drag & drop here';
  document.querySelectorAll('.opt').forEach(e=>e.classList.remove('sel'));
  document.getElementById('opt-'+id).classList.add('sel');
  const o=OPTS.find(x=>x.id===id);
  fileInput.accept=o.accept; fileInput.multiple=o.multi;
  fmtBox.style.display=o.fmt?'flex':'none';
  note.textContent = o.multi ? `You can select multiple images. Max ${MAXMB}MB per file.` :
    (id==='pdf2word' ? `Output is a .doc file (text only, original formatting may change). Max ${MAXMB}MB.` :
     id==='word2pdf' ? `Complex layouts may shift slightly. Max ${MAXMB}MB.` : `Max ${MAXMB}MB per file.`);
  card.classList.add('show'); goBtn.disabled=true;
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

fmtBox.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  fmtBox.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); imgFmt=b.dataset.f;
});

drop.onclick=()=>fileInput.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('has');};
drop.ondrop=e=>{e.preventDefault();handleFiles(e.dataTransfer.files);};
fileInput.onchange=()=>handleFiles(fileInput.files);

function handleFiles(list){
  const arr=Array.from(list);
  for(const f of arr){ if(f.size > MAXMB*1024*1024){ statusEl.className='status err'; statusEl.textContent=`"${f.name}" exceeds ${MAXMB}MB.`; return; } }
  files=arr; resultEl.innerHTML=''; statusEl.textContent='';
  drop.classList.add('has');
  drop.textContent = files.length===1 ? files[0].name : `${files.length} files selected`;
  goBtn.disabled = files.length===0;
}

goBtn.onclick=async ()=>{
  goBtn.disabled=true; resultEl.innerHTML='';
  statusEl.className='status'; statusEl.innerHTML='<span class="spin"></span>Processing...';
  try{
    if(mode==='pdf2img') await pdfToImages(files[0], imgFmt);
    else if(mode==='img2pdf') await imagesToPdf(files);
    else if(mode==='jpg2png') await imgConvert(files[0],'png');
    else if(mode==='png2jpg') await imgConvert(files[0],'jpeg');
    else if(mode==='pdf2word') await pdfToWord(files[0]);
    else if(mode==='word2pdf') await wordToPdf(files[0]);
    statusEl.className='status ok'; statusEl.textContent='Done!';
  }catch(e){
    console.error(e); statusEl.className='status err'; statusEl.textContent='Failed: '+(e.message||e);
  }
  goBtn.disabled=false;
};

function addResult(name,url){
  const row=document.createElement('div'); row.className='dl';
  row.innerHTML=`<span>${name}</span>`;
  const a=document.createElement('a'); a.href=url; a.download=name; a.textContent='Download';
  row.appendChild(a); resultEl.appendChild(row);
}

async function pdfToImages(file, fmt){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const blobs=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const vp=page.getViewport({scale:2});
    const canvas=document.createElement('canvas'); canvas.width=vp.width; canvas.height=vp.height;
    await page.render({canvasContext:canvas.getContext('2d'), viewport:vp}).promise;
    const blob=await new Promise(r=>canvas.toBlob(r, 'image/'+fmt, 0.92));
    blobs.push({name:`page-${i}.${fmt==='jpeg'?'jpg':'png'}`, blob});
  }
  if(blobs.length===1){ addResult(blobs[0].name, URL.createObjectURL(blobs[0].blob)); }
  else{
    const zip=new JSZip();
    blobs.forEach(b=>zip.file(b.name,b.blob));
    const zblob=await zip.generateAsync({type:'blob'});
    addResult('pdf-pages.zip', URL.createObjectURL(zblob));
  }
}

function loadImg(file){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=URL.createObjectURL(file); }); }

async function imagesToPdf(fl){
  const {jsPDF}=window.jspdf; const doc=new jsPDF();
  for(let i=0;i<fl.length;i++){
    const img=await loadImg(fl[i]);
    const pw=doc.internal.pageSize.getWidth(), ph=doc.internal.pageSize.getHeight();
    const r=Math.min(pw/img.width, ph/img.height);
    const w=img.width*r, h=img.height*r;
    if(i>0) doc.addPage();
    doc.addImage(img, 'JPEG', (pw-w)/2, (ph-h)/2, w, h);
  }
  const blob=doc.output('blob'); addResult('result.pdf', URL.createObjectURL(blob));
}

async function imgConvert(file, targetFmt){
  const img=await loadImg(file);
  const canvas=document.createElement('canvas'); canvas.width=img.width; canvas.height=img.height;
  const ctx=canvas.getContext('2d');
  if(targetFmt==='jpeg'){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
  ctx.drawImage(img,0,0);
  const blob=await new Promise(r=>canvas.toBlob(r,'image/'+targetFmt,0.92));
  addResult('result.'+(targetFmt==='jpeg'?'jpg':'png'), URL.createObjectURL(blob));
}

async function pdfToWord(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial,sans-serif;">';
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    const text=tc.items.map(it=>it.str).join(' ');
    html+=`<p>${text.replace(/</g,'&lt;')}</p>`;
    if(i<pdf.numPages) html+='<br clear="all" style="page-break-before:always">';
  }
  html+='</body></html>';
  const blob=new Blob(['\ufeff', html], {type:'application/msword'});
  addResult('result.doc', URL.createObjectURL(blob));
}

async function wordToPdf(file){
  const buf=await file.arrayBuffer();
  const {value:html}=await mammoth.convertToHtml({arrayBuffer:buf});
  const holder=document.createElement('div');
  holder.style.cssText='width:650px;font-family:Arial,sans-serif;font-size:13px;color:#000;background:#fff;padding:10px;position:fixed;left:-9999px;top:0;';
  holder.innerHTML=html;
  document.body.appendChild(holder);
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'pt',format:'a4'});
  await new Promise((resolve,reject)=>{
    doc.html(holder, {
      x:20, y:20, width:555, windowWidth:650,
      callback:(d)=>{ document.body.removeChild(holder); resolve(); },
    });
  });
  const blob=doc.output('blob'); addResult('result.pdf', URL.createObjectURL(blob));
}
</script>
<script src="header-footer.js"></script>
</body>
</html>
