<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convert</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="header-footer.css">

<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#15171c;--sub:#6b7280;--line:#e5e7eb;--accent:#2f6bff;--accent-ink:#fff;--ok:#15803d;--err:#dc2626;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--ink:#f2f3f5;--sub:#9aa0ab;--line:#2a2e37;}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--ink:#f2f3f5;--sub:#9aa0ab;--line:#2a2e37;}

*{box-sizing:border-box;}
html,body{overflow-x:hidden;max-width:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;padding-top:60px;}
.wrap{max-width:720px;margin:0 auto;padding:48px 20px 60px;}

footer .footer-links,footer ul{padding-left:0;margin:0;list-style:none;}

h1{font-size:30px;font-weight:800;text-align:center;letter-spacing:-.5px;margin:0 0 6px;}
.sub{text-align:center;color:var(--sub);font-size:14px;margin-bottom:32px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px;}
@media(max-width:480px){.grid{grid-template-columns:1fr;}}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;text-align:left;font-family:inherit;}
.opt b{display:block;font-size:14px;margin-bottom:2px;}
.opt span{font-size:12px;color:var(--sub);}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, var(--card));}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px;display:none;}
.card.show{display:block;}
.drop{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--sub);font-size:13px;cursor:pointer;}
.drop.has{border-color:var(--accent);color:var(--ink);}
input[type=file]{display:none;}
.go{width:100%;margin-top:16px;background:var(--accent);color:var(--accent-ink);border:none;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;}
.go:disabled{opacity:.5;cursor:default;}
.note{font-size:11.5px;color:var(--sub);margin-top:10px;}
.status{font-size:13px;margin-top:12px;}
.status.err{color:var(--err);}
.status.ok{color:var(--ok);}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin-right:6px;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg);}}

/* Action buttons row */
.actions{display:none;gap:10px;margin-top:16px;}
.actions.show{display:flex;}
.actions > button, .actions .dd > button{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;}
.actions > button:hover, .actions .dd > button:hover{border-color:var(--accent);}

/* Dropdown */
.dd{position:relative;flex:1;}
.dd-menu{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--card);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;display:none;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:260px;overflow-y:auto;}
.dd-menu.show{display:block;}
.dd-menu button{display:block;width:100%;background:none;border:none;padding:11px 14px;text-align:left;font-size:13.5px;font-family:inherit;color:var(--ink);cursor:pointer;font-weight:500;}
.dd-menu button:hover{background:color-mix(in srgb, var(--accent) 10%, var(--card));}
.dd-menu button + button{border-top:1px solid var(--line);}

/* Preview */
.preview-wrap{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px;display:none;}
.preview-title{font-size:12.5px;color:var(--sub);margin-bottom:10px;font-weight:600;letter-spacing:.3px;}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.preview-item{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);}
.preview-item img{display:block;width:100%;height:auto;}
.preview-item .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:11px;padding:14px 8px 6px;font-weight:500;}
</style>
</head>
<body>
<div class="wrap">
<h1>What do you need?</h1>
<div class="sub">Choose a conversion type, then upload your file</div>

<div class="grid" id="grid"></div>

<div class="card" id="card">
  <div class="drop" id="drop">Click to choose a file, or drag & drop here</div>
  <input type="file" id="fileInput">
  <button class="go" id="goBtn" disabled>Convert</button>
  <div class="note" id="note"></div>
  <div class="status" id="status"></div>

  <!-- Action buttons -->
  <div class="actions" id="actions">
    <div class="dd" id="fmtDD" style="display:none">
      <button id="fmtBtn" type="button">
        <i class="fa-solid fa-image"></i> Format: <span id="fmtLabel">JPG</span>
      </button>
      <div class="dd-menu" id="fmtMenu">
        <button data-f="jpeg" type="button">JPG</button>
        <button data-f="png" type="button">PNG</button>
      </div>
    </div>
    <div class="dd" id="dlDD" style="display:none">
      <button id="dlBtn" type="button">
        <i class="fa-solid fa-download"></i> Download
      </button>
      <div class="dd-menu" id="dlMenu"></div>
    </div>
  </div>

  <div class="preview-wrap" id="previewWrap">
    <div class="preview-title">PREVIEW</div>
    <div class="preview-grid" id="previewGrid"></div>
  </div>
</div>
</div>

<script>
const MAXMB = 20;
const OPTS = [
  {id:'pdf2img', t:'PDF to JPG/PNG', d:'Turn PDF pages into images', accept:'.pdf', multi:false},
  {id:'img2pdf', t:'JPG/PNG to PDF', d:'Combine images into one PDF', accept:'image/*', multi:true},
  {id:'jpg2png', t:'JPG to PNG', d:'Convert image format', accept:'.jpg,.jpeg', multi:false},
  {id:'png2jpg', t:'PNG to JPG', d:'Convert image format', accept:'.png', multi:false},
  {id:'pdf2word', t:'PDF to Word', d:'Extract PDF text to docx', accept:'.pdf', multi:false},
  {id:'word2pdf', t:'Word to PDF', d:'Turn docx into a PDF', accept:'.doc,.docx', multi:false},
];

let mode=null, files=[], imgFmt='jpeg';
let results=[]; // {name, blob, url}

const grid=document.getElementById('grid'), card=document.getElementById('card'), drop=document.getElementById('drop'),
      fileInput=document.getElementById('fileInput'), goBtn=document.getElementById('goBtn'),
      statusEl=document.getElementById('status'), note=document.getElementById('note'),
      actions=document.getElementById('actions'),
      fmtDD=document.getElementById('fmtDD'), fmtBtn=document.getElementById('fmtBtn'),
      fmtMenu=document.getElementById('fmtMenu'), fmtLabel=document.getElementById('fmtLabel'),
      dlDD=document.getElementById('dlDD'), dlBtn=document.getElementById('dlBtn'),
      dlMenu=document.getElementById('dlMenu'),
      previewWrap=document.getElementById('previewWrap'), previewGrid=document.getElementById('previewGrid');

OPTS.forEach(o=>{
  const b=document.createElement('button');
  b.className='opt'; b.innerHTML=`<b>${o.t}</b><span>${o.d}</span>`;
  b.onclick=()=>selectMode(o.id);
  b.id='opt-'+o.id;
  grid.appendChild(b);
});

document.addEventListener('click', (e)=>{
  if(!fmtDD.contains(e.target)) fmtMenu.classList.remove('show');
  if(!dlDD.contains(e.target)) dlMenu.classList.remove('show');
});

fmtBtn.onclick=(e)=>{ e.stopPropagation(); dlMenu.classList.remove('show'); fmtMenu.classList.toggle('show'); };
dlBtn.onclick=(e)=>{ e.stopPropagation(); fmtMenu.classList.remove('show'); dlMenu.classList.toggle('show'); };

fmtMenu.querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{
    imgFmt = b.dataset.f;
    fmtLabel.textContent = imgFmt==='jpeg' ? 'JPG' : 'PNG';
    fmtMenu.classList.remove('show');
  };
});

function downloadFile(name, url){
  const a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}

// Rebuild the Download dropdown based on current results
function rebuildDlMenu(){
  dlMenu.innerHTML='';

  if(results.length===1){
    // Only 1 file → just a Download button
    const b=document.createElement('button');
    b.type='button'; b.textContent='Download';
    b.onclick=()=>{
      dlMenu.classList.remove('show');
      downloadFile(results[0].name, results[0].url);
    };
    dlMenu.appendChild(b);
  } else {
    // Multiple files → list each + Download All
    results.forEach((r)=>{
      const b=document.createElement('button');
      b.type='button'; b.textContent='Download: '+r.name;
      b.onclick=()=>{
        dlMenu.classList.remove('show');
        downloadFile(r.name, r.url);
      };
      dlMenu.appendChild(b);
    });
    // Separator + Download All
    const sep=document.createElement('button');
    sep.type='button'; sep.textContent='— Download All —';
    sep.style.cssText='color:var(--accent);font-weight:700;pointer-events:none;background:color-mix(in srgb, var(--accent) 8%, var(--card));';
    dlMenu.appendChild(sep);

    const all=document.createElement('button');
    all.type='button'; all.textContent='Download All';
    all.style.color='var(--accent)'; all.style.fontWeight='700';
    all.onclick=()=>{
      dlMenu.classList.remove('show');
      // Unduh semua satu-satu (bukan zip)
      results.forEach((r, i)=>{
        setTimeout(()=>downloadFile(r.name, r.url), i*350);
      });
      statusEl.className='status ok';
      statusEl.textContent=`Downloading ${results.length} files...`;
    };
    dlMenu.appendChild(all);
  }
}

function clearPreview(){
  previewGrid.innerHTML='';
  previewWrap.style.display='none';
}

function clearResults(){
  results=[];
  actions.classList.remove('show');
  fmtDD.style.display='none';
  dlDD.style.display='none';
  fmtMenu.classList.remove('show');
  dlMenu.classList.remove('show');
  dlMenu.innerHTML='';
}

function selectMode(id){
  mode=id; files=[]; statusEl.textContent=''; drop.classList.remove('has');
  drop.textContent='Click to choose a file, or drag & drop here';
  clearPreview(); clearResults();
  document.querySelectorAll('.opt').forEach(e=>e.classList.remove('sel'));
  document.getElementById('opt-'+id).classList.add('sel');
  const o=OPTS.find(x=>x.id===id);
  fileInput.accept=o.accept; fileInput.multiple=o.multi;
  note.textContent = o.multi ? `You can select multiple images. Max ${MAXMB}MB per file.` :
    (id==='pdf2word' ? `Output is a .doc file (text only, original formatting may change). Max ${MAXMB}MB.` :
     id==='word2pdf' ? `Complex layouts may shift slightly. Max ${MAXMB}MB.` : `Max ${MAXMB}MB per file.`);
  card.classList.add('show'); goBtn.disabled=true;
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

drop.onclick=()=>fileInput.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('has');};
drop.ondrop=e=>{e.preventDefault();handleFiles(e.dataTransfer.files);};
fileInput.onchange=()=>handleFiles(fileInput.files);

function handleFiles(list){
  const arr=Array.from(list);
  for(const f of arr){ if(f.size > MAXMB*1024*1024){ statusEl.className='status err'; statusEl.textContent=`"${f.name}" exceeds ${MAXMB}MB.`; return; } }
  files=arr; statusEl.textContent='';
  clearPreview(); clearResults();
  drop.classList.add('has');
  drop.textContent = files.length===1 ? files[0].name : `${files.length} files selected`;
  goBtn.disabled = files.length===0;
}

goBtn.onclick=async ()=>{
  goBtn.disabled=true; clearResults(); clearPreview();
  statusEl.className='status'; statusEl.innerHTML='<span class="spin"></span>Processing...';
  try{
    if(mode==='pdf2img') await pdfToImages(files[0], imgFmt);
    else if(mode==='img2pdf') await imagesToPdf(files);
    else if(mode==='jpg2png') await imgConvert(files[0],'png');
    else if(mode==='png2jpg') await imgConvert(files[0],'jpeg');
    else if(mode==='pdf2word') await pdfToWord(files[0]);
    else if(mode==='word2pdf') await wordToPdf(files[0]);
    statusEl.className='status ok'; statusEl.textContent='Done!';
  }catch(e){
    console.error(e); statusEl.className='status err'; statusEl.textContent='Failed: '+(e.message||e);
  }
  goBtn.disabled=false;
};

function addResult(name, blob, url){
  results.push({name, blob, url});
}

function addPreview(url, label){
  const item=document.createElement('div'); item.className='preview-item';
  const img=document.createElement('img'); img.src=url; img.alt=label;
  const cap=document.createElement('div'); cap.className='cap'; cap.textContent=label;
  item.appendChild(img); item.appendChild(cap);
  previewGrid.appendChild(item);
  previewWrap.style.display='block';
}

async function pdfToImages(file, fmt){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const ext = fmt==='jpeg' ? 'jpg' : 'png';

  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const vp=page.getViewport({scale:2});
    const canvas=document.createElement('canvas'); canvas.width=vp.width; canvas.height=vp.height;
    await page.render({canvasContext:canvas.getContext('2d'), viewport:vp}).promise;
    const blob=await new Promise(r=>canvas.toBlob(r, 'image/'+fmt, 0.92));
    const url=URL.createObjectURL(blob);
    const fname=`page-${i}.${ext}`;
    addResult(fname, blob, url);
    addPreview(url, `Page ${i}`);
  }
  actions.classList.add('show');
  fmtDD.style.display='block';
  dlDD.style.display='block';
  fmtLabel.textContent = imgFmt==='jpeg' ? 'JPG' : 'PNG';
  rebuildDlMenu();
}

function loadImg(file){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=URL.createObjectURL(file); }); }

async function imagesToPdf(fl){
  const {jsPDF}=window.jspdf; const doc=new jsPDF();
  for(let i=0;i<fl.length;i++){
    const img=await loadImg(fl[i]);
    const pw=doc.internal.pageSize.getWidth(), ph=doc.internal.pageSize.getHeight();
    const r=Math.min(pw/img.width, ph/img.height);
    const w=img.width*r, h=img.height*r;
    if(i>0) doc.addPage();
    doc.addImage(img, 'JPEG', (pw-w)/2, (ph-h)/2, w, h);
    addPreview(URL.createObjectURL(fl[i]), fl[i].name);
  }
  const blob=doc.output('blob'); const url=URL.createObjectURL(blob);
  addResult('result.pdf', blob, url);
  actions.classList.add('show');
  dlDD.style.display='block';
  rebuildDlMenu();
}

async function imgConvert(file, targetFmt){
  const img=await loadImg(file);
  const canvas=document.createElement('canvas'); canvas.width=img.width; canvas.height=img.height;
  const ctx=canvas.getContext('2d');
  if(targetFmt==='jpeg'){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
  ctx.drawImage(img,0,0);
  const blob=await new Promise(r=>canvas.toBlob(r,'image/'+targetFmt,0.92));
  const url=URL.createObjectURL(blob);
  const name='result.'+(targetFmt==='jpeg'?'jpg':'png');
  addResult(name, blob, url);
  addPreview(url, name);
  actions.classList.add('show');
  dlDD.style.display='block';
  rebuildDlMenu();
}

async function pdfToWord(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial,sans-serif;">';
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    const text=tc.items.map(it=>it.str).join(' ');
    html+=`<p>${text.replace(/</g,'&lt;')}</p>`;
    if(i<pdf.numPages) html+='<br clear="all" style="page-break-before:always">';
  }
  html+='</body></html>';
  const blob=new Blob(['\ufeff', html], {type:'application/msword'});
  addResult('result.doc', blob, URL.createObjectURL(blob));
  actions.classList.add('show');
  dlDD.style.display='block';
  rebuildDlMenu();
}

async function wordToPdf(file){
  const buf=await file.arrayBuffer();
  const {value:html}=await mammoth.convertToHtml({arrayBuffer:buf});
  const holder=document.createElement('div');
  holder.style.cssText='width:650px;font-family:Arial,sans-serif;font-size:13px;color:#000;background:#fff;padding:10px;position:fixed;left:-9999px;top:0;';
  holder.innerHTML=html;
  document.body.appendChild(holder);
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'pt',format:'a4'});
  await new Promise((resolve)=>{
    doc.html(holder, {
      x:20, y:20, width:555, windowWidth:650,
      callback:()=>{ document.body.removeChild(holder); resolve(); },
    });
  });
  const blob=doc.output('blob'); const url=URL.createObjectURL(blob);
  addResult('result.pdf', blob, url);
  actions.classList.add('show');
  dlDD.style.display='block';
  rebuildDlMenu();
}
</script>
<script src="header-footer.js"></script>
</body>
</html>
